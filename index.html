<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">

  <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet">

  <script src="script/script.js" defer></script>

</head>

<body>
  <header>
    <div>
      <div class="circulo_grande">
        <div class="circulo_medio">
          <div class="circulo_menor">
          </div>
        </div>
      </div>
    </div>

    <div class="titulo">
      <h1 class="titulo_h1">Pedra - Papel - Tesoura</h1>
    </div>
  </header>

  <div class="combatente">
    <p>Escolha o seu Pokemon:</p>
  </div>

  <section class="botao">
    <div class="botao_conjunto">
      <img src="img/geodude.png" alt="">
      <button type="button">Pedra</button>
    </div>
    <div class="botao_conjunto">
      <img src="img/Kartana.jpg" alt="">
      <button type="button">Papel</button>
    </div>
    <div class="botao_conjunto">
      <img src="img/scizor.png" alt="">
      <button type="button">Tesoura</button>
    </div>
  </section>

  <section class="regras">
    <p>As Regras:</p>
    <div class="regras_div">
      <p>
        Cada elemento vence um e perde para outro:<br><br>

        Pedra ganha da Tesoura (esmaga).<br>

        Tesoura ganha do Papel (corta).<br>

        Papel ganha da Pedra (embrulha).<br><br>

        Símbolos iguais: empate, jogue de novo.
      </p>
    </div>
  </section>

  <footer>
    <p>Desenvolvido por: Filipe S. F.</p>
  </footer>
</body>

</html>
